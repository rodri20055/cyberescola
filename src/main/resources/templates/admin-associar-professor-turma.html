<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Associar Professor a Turma | CyberEscola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Manrope', sans-serif;
    }

    body {
      background: #f8f5ef;
      color: #1f1f1f;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .sidebar {
      width: 290px;
      background: #fffdf9;
      border-right: 1px solid #ddd4c8;
      padding: 28px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-top {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -1px;
      padding: 0 10px;
    }

    .logo span {
      color: #9b6b43;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 14px;
      border-radius: 14px;
      color: #5c5c5c;
      font-weight: 700;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .menu a:hover {
      background: #efe6da;
      color: #1f1f1f;
      transform: translateX(4px);
    }

    .menu a.active {
      background: #1f1f1f;
      color: white;
    }

    .sidebar-footer {
      padding: 0 10px;
      font-size: 0.86rem;
      color: #7a6b5c;
    }

    .main {
      margin-left: 290px;
      min-height: 100vh;
      width: calc(100% - 290px);
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 290px;
      width: calc(100% - 290px);
      z-index: 1000;
      background: rgba(255, 253, 249, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #ddd4c8;
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .topbar-left {
      font-weight: 700;
      color: #5c5c5c;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      background: #efe6da;
      color: #6c4b2d;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid #ddd4c8;
      background: #fffdf9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5c5c5c;
      transition: 0.2s ease;
    }

    .icon-btn:hover {
      background: #1f1f1f;
      color: white;
      border-color: #1f1f1f;
    }

    .content {
      width: 100%;
      max-width: none;
      padding: 118px 24px 40px;
    }

    .page-header {
      margin-bottom: 24px;
    }

    .page-header h1 {
      font-size: 2.3rem;
      margin-bottom: 8px;
    }

    .page-header p {
      color: #5c5c5c;
    }

    .card {
      background: #fffdf9;
      border: 1px solid #ddd4c8;
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.03);
    }

    .card h2 {
      font-size: 1.3rem;
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 14px;
      align-items: end;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .form-group select {
      width: 100%;
      border: 1px solid #ddd4c8;
      border-radius: 16px;
      padding: 14px 16px;
      background: #fff;
      font-size: 0.96rem;
      outline: none;
    }

    .btn-dark {
      padding: 14px 18px;
      border-radius: 16px;
      background: #1f1f1f;
      color: white;
      border: 1px solid #1f1f1f;
      font-weight: 800;
      cursor: pointer;
    }

    .table-card {
      background: #fffdf9;
      border: 1px solid #ddd4c8;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.03);
    }

    .table-wrap {
      overflow-x: auto;
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      font-size: 0.84rem;
      color: #74685d;
      padding: 16px;
      border-bottom: 1px solid #eadfd2;
      text-transform: uppercase;
    }

    td {
      padding: 16px;
      border-bottom: 1px solid #f0e7dc;
      vertical-align: middle;
    }

    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #d63b3b;
      font-size: 1rem;
    }

    @media (max-width: 900px) {
      .sidebar {
        width: 100%;
        position: relative;
        height: auto;
        border-right: none;
        border-bottom: 1px solid #ddd4c8;
      }

      .main {
        margin-left: 0;
        width: 100%;
      }

      .topbar {
        left: 0;
        width: 100%;
        position: relative;
      }

      .content {
        padding-top: 24px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="logo">Cyber<span>Escola</span></div>

      <nav class="menu">
        <a href="/admin"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="/admin/utilizadores"><i class="fa-solid fa-users"></i> Utilizadores</a>
        <a href="/admin/conteudos"><i class="fa-regular fa-folder-open"></i> Conteúdos</a>
        <a href="/admin/jogos"><i class="fa-solid fa-gamepad"></i> Jogos</a>
        <a href="/admin/associar-professor-turma" class="active"><i class="fa-solid fa-school"></i> Associar Turmas</a>
        <a href="/admin/configuracao"><i class="fa-solid fa-gear"></i> Configuração</a>
        <a href="/admin/perfil"><i class="fa-regular fa-user"></i> Perfil</a>
      </nav>
    </div>

    <div class="sidebar-footer">© 2026 CyberEscola</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left" th:text="'Bem-vindo, ' + ${utilizador.nome}">Bem-vindo</div>

      <div class="topbar-right">
        <span class="badge" th:text="${utilizador.tipo}">ADMIN</span>
        <a href="/admin/perfil" class="icon-btn" title="Perfil">
          <i class="fa-solid fa-user"></i>
        </a>
        <a href="/logout" class="icon-btn" title="Sair">
          <i class="fa-solid fa-right-from-bracket"></i>
        </a>
      </div>
    </div>

    <section class="content">
      <div class="page-header">
        <h1>Associar Professor a Turma</h1>
        <p>Gerir a relação entre professores e turmas.</p>
      </div>

      <div class="card">
        <h2>Nova associação</h2>

        <form action="/admin/associar-professor-turma" method="post">
          <div class="form-grid">
            <div class="form-group">
              <label>Professor</label>
              <select name="idProfessor" required>
                <option value="">Selecionar professor</option>
                <option th:each="p : ${professores}"
                        th:value="${p.idUtilizador}"
                        th:text="${p.nome + ' (' + p.email + ')'}">
                </option>
              </select>
            </div>

            <div class="form-group">
              <label>Turma</label>
              <select name="idTurma" required>
                <option value="">Selecionar turma</option>
                <option th:each="t : ${turmas}"
                        th:value="${t.id}"
                        th:text="${t.nome}">
                </option>
              </select>
            </div>

            <button type="submit" class="btn-dark">
              <i class="fa-solid fa-link"></i> Associar
            </button>
          </div>
        </form>
      </div>

      <div class="table-card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID Professor</th>
                <th>ID Turma</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="a : ${associacoes}">
                <td th:text="${a.idProfessor}">1</td>
                <td th:text="${a.idTurma}">1</td>
                <td>
                  <form th:if="${a.id != null}"
                        th:action="@{'/admin/remover-professor-turma/' + ${a.id}}"
                        method="post"
                        style="display:inline;">
                    <button type="submit"
                            class="action-btn"
                            onclick="return confirm('Remover esta associação?')">
                      <i class="fa-solid fa-trash"></i>
                    </button>
                  </form>
                  <span th:if="${a.id == null}">Sem remoção por ID</span>
                </td>
              </tr>

              <tr th:if="${#lists.isEmpty(associacoes)}">
                <td colspan="3">Sem associações registadas.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
