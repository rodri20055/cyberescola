<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conteúdos | CyberEscola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Manrope', sans-serif; }
    body { background: #f8f5ef; color: #1f1f1f; }
    a { text-decoration: none; color: inherit; }

    .sidebar {
      width: 290px;
      background: #fffdf9;
      border-right: 1px solid #ddd4c8;
      padding: 28px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-top { display: flex; flex-direction: column; gap: 28px; }
    .logo { font-size: 1.6rem; font-weight: 800; letter-spacing: -1px; padding: 0 10px; }
    .logo span { color: #9b6b43; }

    .menu { display: flex; flex-direction: column; gap: 10px; }
    .menu a {
      display: flex; align-items: center; gap: 12px; padding: 14px 14px;
      border-radius: 14px; color: #5c5c5c; font-weight: 700;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }
    .menu a:hover { background: #efe6da; color: #1f1f1f; transform: translateX(4px); }
    .menu a.active { background: #2563eb; color: white; }

    .sidebar-footer { padding: 0 10px; font-size: 0.86rem; color: #7a6b5c; }

    .main {
      margin-left: 290px;
      min-height: 100vh;
      width: calc(100% - 290px);
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 290px;
      width: calc(100% - 290px);
      z-index: 1000;
      background: rgba(255,253,249,0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid #ddd4c8;
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar-left { font-weight: 700; color: #5c5c5c; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }

    .badge {
      background: #dbeafe;
      color: #2563eb;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .icon-btn {
      width: 40px; height: 40px; border-radius: 12px; border: 1px solid #ddd4c8;
      background: #fffdf9; display: flex; align-items: center; justify-content: center;
      color: #5c5c5c;
    }

    .content { width: 100%; max-width: none; padding: 118px 24px 40px; }

    .page-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 18px; margin-bottom: 24px; flex-wrap: wrap;
    }

    .page-header h1 { font-size: 2.2rem; margin-bottom: 8px; }
    .page-header p { color: #5c5c5c; }

    .new-btn {
      display: inline-flex; align-items: center; gap: 10px; padding: 14px 18px;
      border-radius: 14px; background: #2563eb; color: white; font-weight: 800;
      border: 1px solid #2563eb; cursor: pointer;
    }

    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }

    .tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 14px;
      background: #f1f5f9;
      color: #64748b;
      font-weight: 800;
    }

    .tab.active {
      background: #2563eb;
      color: white;
    }

    .table-card {
      background: #fffdf9;
      border: 1px solid #ddd4c8;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.03);
    }

    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      font-size: 0.84rem;
      color: #74685d;
      padding: 16px;
      border-bottom: 1px solid #eadfd2;
      text-transform: uppercase;
    }

    td {
      padding: 16px;
      border-bottom: 1px solid #f0e7dc;
      vertical-align: middle;
    }

    tbody tr:hover { background: #faf6f0; }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
      background: #dbeafe;
      color: #2563eb;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }

    .action-blue { color: #2563eb; }
    .action-red { color: #dc2626; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="logo">Cyber<span>Escola</span></div>

      <nav class="menu">
  <a href="/admin"><i class="fa-solid fa-house"></i> Dashboard</a>
  <a href="/admin/utilizadores"><i class="fa-solid fa-users"></i> Utilizadores</a>
  <a href="/admin/conteudos" class="active"><i class="fa-regular fa-folder-open"></i> Conteúdos</a>
  <a href="/admin/configuracao"><i class="fa-solid fa-gear"></i> Configuração</a>
  <a href="/admin/perfil"><i class="fa-regular fa-user"></i> Perfil</a>
</nav>
    </div>

    <div class="sidebar-footer">© 2026 CyberEscola</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left" th:text="'Bem-vindo, ' + ${utilizador.nome}">Bem-vindo</div>

      <div class="topbar-right">
        <span class="badge" th:text="${utilizador.tipo}">ADMIN</span>
        <a href="/admin/perfil" class="icon-btn"><i class="fa-solid fa-user"></i></a>
        <a href="/logout" class="icon-btn"><i class="fa-solid fa-right-from-bracket"></i></a>
      </div>
    </div>

    <section class="content">
      <div class="page-header">
        <div>
          <h1>Gestão de Conteúdos</h1>
          <p>Gerir vídeos e quizzes</p>
        </div>

        <button class="new-btn" type="button">
          <i class="fa-solid fa-plus"></i>
          Novo Conteúdo
        </button>
      </div>

      <div class="tabs">
        <a href="/admin/conteudos?tipo=videos"
           class="tab"
           th:classappend="${tipoSelecionado == 'videos' || tipoSelecionado == null} ? ' active' : ''">
          <i class="fa-regular fa-folder-open"></i>
          Vídeos
        </a>

        <a href="/admin/conteudos?tipo=quizzes"
           class="tab"
           th:classappend="${tipoSelecionado == 'quizzes'} ? ' active' : ''">
          <i class="fa-regular fa-bookmark"></i>
          Quizzes
        </a>
      </div>

      <div class="table-card" th:if="${tipoSelecionado == null or tipoSelecionado == 'videos'}">
        <table>
          <thead>
            <tr>
              <th>Título</th>
              <th>Tema</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="c : ${conteudos}">
              <td th:text="${c.titulo}">Título</td>
              <td><span class="tag" th:text="${c.tema}">Tema</span></td>
              <td>
                <div class="actions">
                  <button type="button" class="action-btn action-blue" title="Editar">
                    <i class="fa-regular fa-pen-to-square"></i>
                  </button>
                  <form th:action="@{'/admin/conteudos/apagar/' + ${c.id}}" method="post" style="display:inline;">
                    <button type="submit"
                            class="action-btn action-red"
                            title="Apagar"
                            onclick="return confirm('Tens a certeza que queres apagar este conteúdo?')">
                      <i class="fa-solid fa-trash"></i>
                    </button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="table-card" th:if="${tipoSelecionado == 'quizzes'}">
        <table>
          <thead>
            <tr>
              <th>Título</th>
              <th>Tema</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="q : ${quizzes}">
              <td th:text="${q.titulo}">Quiz</td>
              <td><span class="tag" th:text="${q.tema}">Tema</span></td>
              <td>
                <div class="actions">
                  <button type="button" class="action-btn action-blue" title="Editar">
                    <i class="fa-regular fa-pen-to-square"></i>
                  </button>
                  <form th:action="@{'/admin/quizzes/apagar/' + ${q.id}}" method="post" style="display:inline;">
                    <button type="submit"
                            class="action-btn action-red"
                            title="Apagar quiz"
                            onclick="return confirm('Tens a certeza que queres apagar este quiz?')">
                      <i class="fa-solid fa-trash"></i>
                    </button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

</body>
</html>
