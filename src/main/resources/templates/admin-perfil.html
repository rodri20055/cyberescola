<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil | CyberEscola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Manrope', sans-serif;
    }

    body {
      background: #f8f5ef;
      color: #1f1f1f;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .sidebar {
      width: 290px;
      background: #fffdf9;
      border-right: 1px solid #ddd4c8;
      padding: 28px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-top {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -1px;
      padding: 0 10px;
    }

    .logo span {
      color: #9b6b43;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 14px;
      border-radius: 14px;
      color: #5c5c5c;
      font-weight: 700;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .menu a:hover {
      background: #efe6da;
      color: #1f1f1f;
      transform: translateX(4px);
    }

    .menu a.active {
      background: #1f1f1f;
      color: white;
    }

    .sidebar-footer {
      padding: 0 10px;
      font-size: 0.86rem;
      color: #7a6b5c;
    }

    .main {
      margin-left: 290px;
      min-height: 100vh;
      width: calc(100% - 290px);
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 290px;
      width: calc(100% - 290px);
      z-index: 1000;
      background: rgba(255, 253, 249, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid #ddd4c8;
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .topbar-left {
      font-weight: 700;
      color: #5c5c5c;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      background: #efe6da;
      color: #6c4b2d;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid #ddd4c8;
      background: #fffdf9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5c5c5c;
      transition: 0.2s ease;
    }

    .icon-btn:hover {
      background: #1f1f1f;
      color: white;
      border-color: #1f1f1f;
    }

    .content {
      width: 100%;
      max-width: none;
      padding: 118px 24px 40px;
    }

    .page-header {
      margin-bottom: 24px;
    }

    .page-header h1 {
      font-size: 2.4rem;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .page-header p {
      color: #5c5c5c;
    }

    .perfil-card {
      max-width: 760px;
      background: #fffdf9;
      border: 1px solid #ddd4c8;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.03);
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    }

    .perfil-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(0,0,0,0.06);
      border-color: #cdbca9;
    }

    .perfil-topo {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 24px;
    }

    .perfil-foto {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: #efe6da;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6c4b2d;
      font-size: 1.8rem;
      overflow: hidden;
      flex-shrink: 0;
    }

    .perfil-foto img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .perfil-info h2 {
      font-size: 1.9rem;
      margin-bottom: 6px;
      letter-spacing: -0.6px;
    }

    .perfil-info p {
      color: #6f6257;
      margin-bottom: 8px;
    }

    .perfil-tag {
      display: inline-flex;
      align-items: center;
      padding: 7px 12px;
      border-radius: 999px;
      background: #efe6da;
      color: #6c4b2d;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .divider {
      height: 1px;
      background: #ece2d6;
      margin: 24px 0;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group:last-of-type {
      margin-bottom: 0;
    }

    .form-group label {
      display: block;
      font-weight: 800;
      margin-bottom: 8px;
      color: #1f1f1f;
    }

    .input-icon {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #7a6b5c;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .form-group input {
      width: 100%;
      border: 1px solid #ddd4c8;
      border-radius: 16px;
      background: #fff;
      padding: 14px 16px;
      font-size: 0.96rem;
      outline: none;
      color: #1f1f1f;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-group input:focus {
      border-color: #cdbca9;
      box-shadow: 0 0 0 3px rgba(239, 230, 218, 0.65);
    }

    .form-group input[disabled] {
      background: #faf6f0;
      color: #7a6b5c;
      cursor: not-allowed;
    }

    .save-btn {
      margin-top: 22px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 999px;
      background: #1f1f1f;
      color: white;
      font-weight: 800;
      border: 1px solid #1f1f1f;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 20px rgba(0,0,0,0.08);
    }

    @media (max-width: 900px) {
      .sidebar {
        width: 100%;
        position: relative;
        height: auto;
        border-right: none;
        border-bottom: 1px solid #ddd4c8;
      }

      .main {
        margin-left: 0;
        width: 100%;
      }

      .topbar {
        left: 0;
        width: 100%;
      }

      .content {
        padding-top: 108px;
      }

      .perfil-topo {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="logo">Cyber<span>Escola</span></div>

      <nav class="menu">
        <a href="/admin"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="/admin/utilizadores"><i class="fa-solid fa-users"></i> Utilizadores</a>
        <a href="/admin/conteudos"><i class="fa-regular fa-folder-open"></i> Conteúdos</a>
        <a href="/admin/configuracao"><i class="fa-solid fa-gear"></i> Configuração</a>
        <a href="/admin/perfil" class="active"><i class="fa-regular fa-user"></i> Perfil</a>
      </nav>
    </div>

    <div class="sidebar-footer">© 2026 CyberEscola</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left" th:text="'Bem-vindo, ' + ${utilizador.nome}">Bem-vindo</div>

      <div class="topbar-right">
        <span class="badge" th:text="${utilizador.tipo}">ADMIN</span>
        <a href="/admin/perfil" class="icon-btn" title="Perfil">
          <i class="fa-solid fa-user"></i>
        </a>
        <a href="/logout" class="icon-btn" title="Sair">
          <i class="fa-solid fa-right-from-bracket"></i>
        </a>
      </div>
    </div>

    <section class="content">
      <div class="page-header">
        <h1>Perfil</h1>
        <p>Consulta e atualiza os teus dados pessoais.</p>
      </div>

      <div class="perfil-card">
        <div class="perfil-topo">
          <div class="perfil-foto">
            <img th:if="${utilizador.fotoPerfil != null and utilizador.fotoPerfil != ''}"
                 th:src="@{${utilizador.fotoPerfil}}"
                 alt="Foto de perfil">
            <i th:if="${utilizador.fotoPerfil == null or utilizador.fotoPerfil == ''}"
               class="fa-regular fa-user"></i>
          </div>

          <div class="perfil-info">
            <h2 th:text="${utilizador.nome}">Administrador</h2>
            <p th:text="${utilizador.email}">admin@cyberescola.pt</p>
            <span class="perfil-tag" th:text="${utilizador.tipo}">ADMIN</span>
          </div>
        </div>

        <div class="divider"></div>

        <form action="/perfil/editar" method="post">
          <div class="form-group">
            <div class="input-icon">
              <i class="fa-regular fa-user"></i>
              <span>Nome</span>
            </div>
            <input type="text" name="nome" th:value="${utilizador.nome}" required>
          </div>

          <div class="form-group">
            <div class="input-icon">
              <i class="fa-regular fa-envelope"></i>
              <span>Email</span>
            </div>
            <input type="email" name="email" th:value="${utilizador.email}" required>
          </div>

          <div class="form-group">
            <div class="input-icon">
              <i class="fa-solid fa-shield-halved"></i>
              <span>Função</span>
            </div>
            <input type="text" th:value="${utilizador.tipo}" disabled>
          </div>

          <button type="submit" class="save-btn">
            <i class="fa-regular fa-floppy-disk"></i>
            Guardar alterações
          </button>
        </form>
      </div>
    </section>
  </main>

</body>
</html>
