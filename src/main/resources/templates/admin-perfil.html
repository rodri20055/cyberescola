<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil | CyberEscola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Manrope', sans-serif; }
    body { background: #f8f5ef; color: #1f1f1f; }
    a { text-decoration: none; color: inherit; }

    .sidebar {
      width: 290px; background: #fffdf9; border-right: 1px solid #ddd4c8;
      padding: 28px 18px; display: flex; flex-direction: column; justify-content: space-between;
      position: fixed; top: 0; left: 0; height: 100vh; overflow-y: auto;
    }

    .sidebar-top { display: flex; flex-direction: column; gap: 28px; }
    .logo { font-size: 1.6rem; font-weight: 800; letter-spacing: -1px; padding: 0 10px; }
    .logo span { color: #9b6b43; }

    .menu { display: flex; flex-direction: column; gap: 10px; }
    .menu a {
      display: flex; align-items: center; gap: 12px; padding: 14px 14px;
      border-radius: 14px; color: #5c5c5c; font-weight: 700;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }
    .menu a:hover { background: #efe6da; color: #1f1f1f; transform: translateX(4px); }
    .menu a.active { background: #2563eb; color: white; }

    .sidebar-footer { padding: 0 10px; font-size: 0.86rem; color: #7a6b5c; }

    .main { margin-left: 290px; min-height: 100vh; width: calc(100% - 290px); }

    .topbar {
      position: fixed; top: 0; left: 290px; width: calc(100% - 290px); z-index: 1000;
      background: rgba(255,253,249,0.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid #ddd4c8; padding: 20px 28px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .topbar-left { font-weight: 700; color: #5c5c5c; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }

    .badge {
      background: #dbeafe; color: #2563eb; padding: 8px 14px; border-radius: 999px;
      font-size: 0.8rem; font-weight: 800; text-transform: uppercase;
    }

    .icon-btn {
      width: 40px; height: 40px; border-radius: 12px; border: 1px solid #ddd4c8;
      background: #fffdf9; display: flex; align-items: center; justify-content: center; color: #5c5c5c;
    }

    .content { width: 100%; max-width: none; padding: 118px 24px 40px; }

    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-size: 2.2rem; margin-bottom: 8px; }
    .page-header p { color: #5c5c5c; }

    .perfil-card {
      max-width: 700px;
      background: #fffdf9;
      border: 1px solid #ddd4c8;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.03);
    }

    .perfil-topo {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
    }

    .perfil-foto {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #dbeafe;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2563eb;
      font-size: 1.8rem;
    }

    .perfil-topo h2 {
      font-size: 1.8rem;
      margin-bottom: 6px;
    }

    .perfil-tag {
      display: inline-flex;
      padding: 6px 10px;
      border-radius: 999px;
      background: #dbeafe;
      color: #2563eb;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .divider {
      height: 1px;
      background: #e5e7eb;
      margin: 18px 0 22px;
    }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .input-icon {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #64748b;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .form-group input {
      width: 100%;
      border: 1px solid #d7cec2;
      border-radius: 14px;
      background: #f8fafc;
      padding: 14px 16px;
      font-size: 1rem;
      outline: none;
    }

    .save-btn {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-weight: 800;
      border: 1px solid #2563eb;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="logo">Cyber<span>Escola</span></div>

      <nav class="menu">
        <a href="/admin"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="/admin/utilizadores"><i class="fa-solid fa-users"></i> Utilizadores</a>
        <a href="/admin/conteudos"><i class="fa-regular fa-folder-open"></i> Conteúdos</a>
        <a href="/admin/configuracao"><i class="fa-solid fa-gear"></i> Configuração</a>
        <a href="/admin/perfil" class="active"><i class="fa-regular fa-user"></i> Perfil</a>
      </nav>
    </div>

    <div class="sidebar-footer">© 2026 CyberEscola</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left" th:text="'Bem-vindo, ' + ${utilizador.nome}">Bem-vindo</div>

      <div class="topbar-right">
        <span class="badge" th:text="${utilizador.tipo}">ADMIN</span>
        <a href="/admin/perfil" class="icon-btn"><i class="fa-solid fa-user"></i></a>
        <a href="/logout" class="icon-btn"><i class="fa-solid fa-right-from-bracket"></i></a>
      </div>
    </div>

    <section class="content">
      <div class="page-header">
        <h1>Perfil</h1>
        <p>As suas informações pessoais</p>
      </div>

      <div class="perfil-card">
        <div class="perfil-topo">
          <div class="perfil-foto">
            <i class="fa-regular fa-user"></i>
          </div>

          <div>
            <h2 th:text="${utilizador.nome}">Carlos Admin</h2>
            <span class="perfil-tag" th:text="${utilizador.tipo}">ADMIN</span>
          </div>
        </div>

        <div class="divider"></div>

        <form action="/perfil/editar" method="post">
          <div class="form-group">
            <div class="input-icon">
              <i class="fa-regular fa-user"></i>
              <span>Nome</span>
            </div>
            <input type="text" name="nome" th:value="${utilizador.nome}">
          </div>

          <div class="form-group">
            <div class="input-icon">
              <i class="fa-regular fa-envelope"></i>
              <span>Email</span>
            </div>
            <input type="email" name="email" th:value="${utilizador.email}">
          </div>

          <div class="form-group">
            <div class="input-icon">
              <i class="fa-regular fa-shield"></i>
              <span>Função</span>
            </div>
            <input type="text" th:value="${utilizador.tipo}" disabled>
          </div>

          <button type="submit" class="save-btn">Guardar Alterações</button>
        </form>
      </div>
    </section>
  </main>

</body>
</html>
