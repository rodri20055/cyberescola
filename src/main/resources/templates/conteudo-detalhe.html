<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conteúdo | CyberEscola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Manrope', sans-serif;
    }

    body {
      background: #f8f5ef;
      color: #1f1f1f;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .dashboard {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 290px;
      background: #fffdf9;
      border-right: 1px solid #ddd4c8;
      padding: 28px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-top {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -1px;
      padding: 0 10px;
    }

    .logo span {
      color: #9b6b43;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 14px;
      border-radius: 14px;
      color: #5c5c5c;
      font-weight: 700;
      transition: 0.2s;
    }

    .menu a i {
      width: 18px;
      text-align: center;
    }

    .menu a:hover {
      background: #efe6da;
      color: #1f1f1f;
    }

    .menu a.active {
      background: #1f1f1f;
      color: white;
    }

    .sidebar-footer {
      padding: 0 10px;
      font-size: 0.86rem;
      color: #7a6b5c;
    }

    .main {
      margin-left: 290px;
      min-height: 100vh;
      width: calc(100% - 290px);
    }

    .topbar {
      width: 100%;
      background: #fffdf9;
      border-bottom: 1px solid #ddd4c8;
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar-left {
      font-weight: 700;
      color: #5c5c5c;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      background: #efe6da;
      color: #6c4b2d;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid #ddd4c8;
      background: #fffdf9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5c5c5c;
    }

    .content {
      width: 100%;
      max-width: 1180px;
      padding: 32px 24px 40px;
      margin: 0 auto;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #6f6257;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .page-header h1 {
      font-size: 2.35rem;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .meta {
      color: #7a6b5c;
      font-size: 1rem;
      margin-bottom: 22px;
    }

    .video-frame {
      background: #fffdf9;
      border: 1px solid #ddd4c8;
      border-radius: 26px;
      overflow: hidden;
      margin-bottom: 22px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.03);
    }

    .video-embed {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
      display: block;
      background: #ece2d6;
    }

    .description {
      color: #5c5c5c;
      font-size: 1rem;
      line-height: 1.8;
      margin-bottom: 28px;
      max-width: 900px;
    }

    .action-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn-dark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #1f1f1f;
      color: white;
      padding: 14px 20px;
      border-radius: 999px;
      font-weight: 800;
      border: 1px solid #1f1f1f;
    }

    .btn-light {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #fffdf9;
      color: #1f1f1f;
      padding: 14px 20px;
      border-radius: 999px;
      font-weight: 800;
      border: 1px solid #d7cec2;
    }
    @media (max-width: 900px) {
  .sidebar {
    width: 100%;
    position: relative !important;
    top: 0;
    left: 0;
    height: auto !important;
    border-right: none;
    border-bottom: 1px solid #ddd4c8;
    overflow-y: visible !important;
    z-index: 1;
  }

  .main {
    margin-left: 0 !important;
    width: 100% !important;
  }

  .topbar {
    position: relative !important;
    top: 0;
    left: 0 !important;
    width: 100% !important;
  }

  .content {
    padding-top: 24px !important;
  }
}
  </style>
</head>
<body>

  <div class="dashboard">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="logo">Cyber<span>Escola</span></div>

        <nav class="menu">
  <a href="/aluno"><i class="fa-solid fa-house"></i> Dashboard</a>
  <a href="/conteudos" class="active"><i class="fa-solid fa-book-open"></i> Conteúdos</a>
  <a href="/jogos"><i class="fa-solid fa-gamepad"></i> Jogos</a>
  <a href="/ranking"><i class="fa-solid fa-trophy"></i> Classificação</a>
  <a href="/perfil"><i class="fa-solid fa-user"></i> Perfil</a>
</nav>
      </div>

      <div class="sidebar-footer">© 2026 CyberEscola</div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="topbar-left" th:text="'Bem-vindo, ' + ${utilizadorLogado.nome}">
          Bem-vindo, Aluno
        </div>

        <div class="topbar-right">
          <span class="badge" th:text="${utilizadorLogado.tipo}">ALUNO</span>
          <a href="/perfil" class="icon-btn"><i class="fa-solid fa-user"></i></a>
          <a href="/logout" class="icon-btn"><i class="fa-solid fa-right-from-bracket"></i></a>
        </div>
      </div>

      <section class="content">
        <a href="/conteudos" class="back-link">
          <i class="fa-solid fa-arrow-left"></i>
          Voltar aos conteúdos
        </a>

        <div class="page-header">
          <h1 th:text="${conteudo.titulo}">Título</h1>
        </div>

        <div class="meta">
          <span th:text="${conteudo.tema}">Tema</span>
          ·
          <span th:text="${conteudo.duracao}">0:00</span>
        </div>

        <div class="video-frame">
          <iframe class="video-embed"
                  th:src="${conteudo.videoUrl}"
                  title="Vídeo"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  allowfullscreen>
          </iframe>
        </div>

        <p class="description" th:text="${conteudo.descricao}">
          Descrição
        </p>

        <div class="action-row">
          <a th:href="@{'/quiz-associado/' + ${conteudo.id}}" class="btn-dark">
            <i class="fa-solid fa-book-open"></i>
            Fazer quiz associado
          </a>

          <a href="/conteudos" class="btn-light">
            <i class="fa-solid fa-arrow-left"></i>
            Voltar
          </a>
        </div>
      </section>
    </main>
  </div>

  <script th:inline="javascript">
  const conteudoId = /*[[${conteudo.id}]]*/ 0;

  setTimeout(() => {
    fetch('/conteudo/' + conteudoId + '/marcar-visto', {
      method: 'POST'
    });
  }, 10000);
</script>

</body>
</html>
