<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conteúdos | CyberEscola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Manrope', sans-serif;
    }

    body {
      background: #f8f5ef;
      color: #1f1f1f;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .dashboard {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
  width: 290px;
  background: #fffdf9;
  border-right: 1px solid #ddd4c8;
  padding: 28px 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  overflow-y: auto;
}

    .sidebar-top {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -1px;
      padding: 0 10px;
    }

    .logo span {
      color: #9b6b43;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 14px;
      border-radius: 14px;
      color: #5c5c5c;
      font-weight: 700;
      transition: 0.2s;
    }

    .menu a i {
      width: 18px;
      text-align: center;
    }

    .menu a:hover {
      background: #efe6da;
      color: #1f1f1f;
    }

    .menu a.active {
      background: #1f1f1f;
      color: white;
    }

    .sidebar-footer {
      padding: 0 10px;
      font-size: 0.86rem;
      color: #7a6b5c;
    }

    .main {
  margin-left: 290px;
  min-height: 100vh;
  width: calc(100% - 290px);
}

    .topbar {
  width: 100%;
  background: #fffdf9;
  border-bottom: 1px solid #ddd4c8;
  padding: 20px 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

    .topbar-left {
      font-weight: 700;
      color: #5c5c5c;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      background: #efe6da;
      color: #6c4b2d;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid #ddd4c8;
      background: #fffdf9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5c5c5c;
    }

    .content {
  width: 100%;
  max-width: none;
  padding: 30px 24px 34px;
}

    .page-header {
      margin-bottom: 22px;
    }

    .page-header h1 {
      font-size: 2.3rem;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .page-header p {
      color: #5c5c5c;
      font-size: 1rem;
    }

    .search-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }

    .search-box i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #8a8a8a;
    }

    .search-box input {
      width: 100%;
      padding: 14px 14px 14px 42px;
      border: 1px solid #d7cec2;
      border-radius: 18px;
      background: #fffdf9;
      font-size: 0.95rem;
      outline: none;
    }

    .filter-tags {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-tags a {
  padding: 12px 16px;
  border-radius: 16px;
  background: #efe6da;
  color: #6c4b2d;
  font-weight: 700;
  font-size: 0.9rem;
  display: inline-block;
  transition: 0.2s;
}

.filter-tags a:hover {
  opacity: 0.9;
}

.filter-tags a.active {
  background: #1f1f1f;
  color: white;
}

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .content-card {
      background: #fffdf9;
      border: 1px solid #ddd4c8;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.03);
    }

    .content-thumb {
      height: 210px;
      background: #ece2d6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: #7a6b5c;
    }

    .content-body {
      padding: 18px;
    }

    .content-tag {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      background: #efe6da;
      color: #6c4b2d;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .content-body h3 {
      font-size: 1.05rem;
      margin-bottom: 10px;
    }

    .content-body p {
      color: #5c5c5c;
      line-height: 1.6;
      font-size: 0.94rem;
      margin-bottom: 14px;
      min-height: 52px;
    }

    .content-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: #7a6b5c;
    }

    .content-footer a {
      font-weight: 800;
      color: #1f1f1f;
    }

    @media (max-width: 1100px) {
      .cards-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 900px) {
      .dashboard {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #ddd4c8;
      }

      .cards-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="logo">Cyber<span>Escola</span></div>

        <nav class="menu">
          <a href="/aluno"><i class="fa-solid fa-house"></i> Dashboard</a>
          <a href="/conteudos" class="active"><i class="fa-solid fa-book-open"></i> Conteúdos</a>
          <a href="/ranking"><i class="fa-solid fa-trophy"></i> Classificação</a>
          <a href="/perfil"><i class="fa-solid fa-user"></i> Perfil</a>
        </nav>
      </div>

      <div class="sidebar-footer">© 2026 CyberEscola</div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="topbar-left" th:text="'Bem-vindo, ' + ${utilizadorLogado.nome}">
          Bem-vindo, Aluno
        </div>

        <div class="topbar-right">
          <span class="badge" th:text="${utilizadorLogado.tipo}">ALUNO</span>
          <a href="/perfil" class="icon-btn"><i class="fa-solid fa-user"></i></a>
          <a href="/logout" class="icon-btn"><i class="fa-solid fa-right-from-bracket"></i></a>
        </div>
      </div>

      <section class="content">
        <div class="page-header">
          <h1>Conteúdos</h1>
          <p>Explora vídeos sobre cibersegurança</p>
        </div>

        <div class="search-row">
          <form action="/conteudos" method="get" class="search-box">
  <i class="fa-solid fa-magnifying-glass"></i>
  <input type="text" name="q" placeholder="Pesquisar vídeos..." th:value="${pesquisa}">
  <input type="hidden" name="tema" th:value="${temaSelecionado}">
</form>

          <div class="filter-tags">
  <a th:href="@{/conteudos(q=${pesquisa})}"
     th:classappend="${temaSelecionado == ''} ? ' active' : ''">Todos</a>

  <a th:href="@{/conteudos(tema='Phishing', q=${pesquisa})}"
     th:classappend="${temaSelecionado == 'Phishing'} ? ' active' : ''">Phishing</a>

  <a th:href="@{/conteudos(tema='Senhas', q=${pesquisa})}"
     th:classappend="${temaSelecionado == 'Senhas'} ? ' active' : ''">Senhas</a>

  <a th:href="@{/conteudos(tema='Privacidade', q=${pesquisa})}"
     th:classappend="${temaSelecionado == 'Privacidade'} ? ' active' : ''">Privacidade</a>
</div>
        </div>

        <div class="cards-grid">
          <div class="content-card" th:each="c : ${conteudos}">
            <div class="content-thumb">
              <i class="fa-regular fa-circle-play"></i>
            </div>

            <div class="content-body">
              <div class="content-tag" th:text="${c.tema}">Tema</div>
              <h3 th:text="${c.titulo}">Título</h3>
              <p th:text="${c.descricao}">Descrição</p>

              <div class="content-footer">
                <span th:text="${c.duracao}">0:00</span>
                <a th:href="@{'/conteudo/' + ${c.id}}">Ver →</a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

</body>
</html>
