<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deteta o Smishing | CyberEscola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Manrope', sans-serif; }
    body { background: #f8f5ef; color: #1f1f1f; }
    .container { max-width: 1000px; margin: 0 auto; padding: 28px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
    h1 { font-size: 2.2rem; margin-bottom: 8px; }
    p { color: #5c5c5c; }
    .badge {
      background: #efe6da; color: #6c4b2d; padding: 8px 14px; border-radius: 999px;
      font-size: 0.85rem; font-weight: 800;
    }
    .intro {
      background: #fffdf9; border: 1px solid #ddd4c8; border-radius: 20px;
      padding: 18px; margin-bottom: 20px;
    }
    .cards {
      display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px;
    }
    .msg-card {
      background: #fffdf9; border: 1px solid #ddd4c8; border-radius: 22px;
      padding: 20px; box-shadow: 0 6px 18px rgba(0,0,0,0.03);
    }
    .msg-header {
      display: flex; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .msg-from {
      font-weight: 800;
    }
    .msg-bubble {
      background: #dcf8c6;
      border-radius: 18px;
      padding: 16px;
      line-height: 1.7;
      margin-bottom: 16px;
      border: 1px solid #cfeab7;
    }
    .actions {
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .btn {
      border: none; border-radius: 999px; padding: 12px 16px; font-weight: 800; cursor: pointer;
    }
    .btn-danger { background: #b42318; color: white; }
    .btn-safe { background: #027a48; color: white; }
    .btn-submit { background: #1f1f1f; color: white; margin-top: 8px; }
    .status { color: #6f6257; font-size: 0.95rem; font-weight: 700; margin-top: 12px; }

    @media (max-width: 900px) {
  .sidebar {
    width: 100%;
    position: relative !important;
    top: 0;
    left: 0;
    height: auto !important;
    border-right: none;
    border-bottom: 1px solid #ddd4c8;
    overflow-y: visible !important;
    z-index: 1;
  }

  .main {
    margin-left: 0 !important;
    width: 100% !important;
  }

  .topbar {
    position: relative !important;
    top: 0;
    left: 0 !important;
    width: 100% !important;
  }

  .content {
    padding-top: 24px !important;
  }
}
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <h1 th:text="${jogo.titulo}">Deteta o Smishing</h1>
        <p>Analisa cada mensagem e decide se é fraude por SMS.</p>
      </div>
      <div class="badge">
        Tempo restante: <span id="tempoRestante" th:text="${jogo.tempoLimite}">75</span>s
      </div>
    </div>

    <div class="intro">
      Marca cada mensagem como <strong>smishing</strong> ou <strong>segura</strong>.
    </div>

    <div id="cards" class="cards"></div>

    <div class="status" id="status">Nenhuma decisão registada ainda.</div>

    <form id="formFinal" th:action="@{'/jogo/' + ${jogo.id} + '/submeter-smishing'}" method="post">
      <input type="hidden" name="pontuacao" id="pontuacaoFinal">
      <input type="hidden" name="acertos" id="acertosFinal">
      <input type="hidden" name="erros" id="errosFinal">
      <input type="hidden" name="tempoSegundos" id="tempoSegundosFinal">
      <input type="hidden" name="detalheJson" id="detalheJsonFinal">

      <button type="button" class="btn btn-submit" onclick="submeterJogo()">
        Submeter resultado
      </button>
    </form>
  </div>

  <script th:inline="javascript">
    const jogoData = JSON.parse(/*[[${dadosJson}]]*/ '{}');
    const mensagens = jogoData.mensagens || [];
    const respostas = {};
    const inicio = Date.now();
    let tempoRestante = /*[[${jogo.tempoLimite}]]*/ 75;
    let jogoSubmetido = false;

    const cardsEl = document.getElementById('cards');
    const statusEl = document.getElementById('status');
    const tempoRestanteEl = document.getElementById('tempoRestante');

    function renderCards() {
      cardsEl.innerHTML = '';

      mensagens.forEach(item => {
        const resposta = respostas[item.id];
        let estado = 'Por avaliar';
        if (resposta === true) estado = 'Marcada como smishing';
        if (resposta === false) estado = 'Marcada como segura';

        const card = document.createElement('div');
        card.className = 'msg-card';
        card.innerHTML = `
          <div class="msg-header">
            <div class="msg-from">${item.remetente}</div>
          </div>
          <div class="msg-bubble">${item.texto}</div>
          <div class="actions">
            <button type="button" class="btn btn-danger" onclick="marcar(${item.id}, true)">Smishing</button>
            <button type="button" class="btn btn-safe" onclick="marcar(${item.id}, false)">Segura</button>
          </div>
          <div class="status">${estado}</div>
        `;
        cardsEl.appendChild(card);
      });
    }

    function marcar(id, valor) {
      if (jogoSubmetido) return;
      respostas[id] = valor;
      statusEl.textContent = 'Decisão registada.';
      renderCards();
    }

    function submeterJogo() {
      if (jogoSubmetido) return;
      jogoSubmetido = true;

      let acertos = 0;
      let erros = 0;

      mensagens.forEach(item => {
        const resposta = respostas[item.id];
        if (resposta !== undefined) {
          if (resposta === item.smishing) acertos++;
          else erros++;
        }
      });

      const pontuacao = Math.max(0, (acertos * 20) - (erros * 10));
      const tempoSegundos = Math.floor((Date.now() - inicio) / 1000);

      document.getElementById('pontuacaoFinal').value = pontuacao;
      document.getElementById('acertosFinal').value = acertos;
      document.getElementById('errosFinal').value = erros;
      document.getElementById('tempoSegundosFinal').value = tempoSegundos;
      document.getElementById('detalheJsonFinal').value = JSON.stringify(respostas);

      document.getElementById('formFinal').submit();
    }

    function iniciarTemporizador() {
      tempoRestanteEl.textContent = tempoRestante;

      const intervalo = setInterval(() => {
        if (jogoSubmetido) {
          clearInterval(intervalo);
          return;
        }

        tempoRestante--;
        tempoRestanteEl.textContent = tempoRestante;

        if (tempoRestante <= 0) {
          clearInterval(intervalo);
          statusEl.textContent = 'O tempo terminou. A submeter automaticamente...';
          submeterJogo();
        }
      }, 1000);
    }

    renderCards();
    iniciarTemporizador();
  </script>
</body>
</html>
