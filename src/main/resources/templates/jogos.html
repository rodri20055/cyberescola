<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogos | CyberEscola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Manrope', sans-serif;
    }

    body {
      background: #f8f5ef;
      color: #1f1f1f;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .dashboard {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 290px;
      background: #fffdf9;
      border-right: 1px solid #ddd4c8;
      padding: 28px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-top {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -1px;
      padding: 0 10px;
    }

    .logo span {
      color: #9b6b43;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 14px;
      border-radius: 14px;
      color: #5c5c5c;
      font-weight: 700;
      transition: 0.2s;
    }

    .menu a:hover {
      background: #efe6da;
      color: #1f1f1f;
    }

    .menu a.active {
      background: #1f1f1f;
      color: white;
    }

    .sidebar-footer {
      padding: 0 10px;
      font-size: 0.86rem;
      color: #7a6b5c;
    }

    .main {
      margin-left: 290px;
      min-height: 100vh;
      width: calc(100% - 290px);
    }

    .topbar {
      background: #fffdf9;
      border-bottom: 1px solid #ddd4c8;
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar-left {
      font-weight: 700;
      color: #5c5c5c;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      background: #efe6da;
      color: #6c4b2d;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid #ddd4c8;
      background: #fffdf9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5c5c5c;
    }

    .content {
      width: 100%;
      padding: 30px 24px 34px;
    }

    .page-header {
      margin-bottom: 24px;
    }

    .page-header h1 {
      font-size: 2.3rem;
      margin-bottom: 8px;
    }

    .page-header p {
      color: #5c5c5c;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .game-card {
      background: #fffdf9;
      border: 1px solid #ddd4c8;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.03);
    }

    .game-tag {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      background: #efe6da;
      color: #6c4b2d;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .game-card h3 {
      font-size: 1.15rem;
      margin-bottom: 10px;
    }

    .game-card p {
      color: #5c5c5c;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .btn-dark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #1f1f1f;
      color: white;
      padding: 14px 18px;
      border-radius: 999px;
      font-weight: 800;
    }
    @media (max-width: 900px) {
  .sidebar {
    width: 100%;
    position: relative !important;
    top: 0;
    left: 0;
    height: auto !important;
    border-right: none;
    border-bottom: 1px solid #ddd4c8;
    overflow-y: visible !important;
    z-index: 1;
  }

  .main {
    margin-left: 0 !important;
    width: 100% !important;
  }

  .topbar {
    position: relative !important;
    top: 0;
    left: 0 !important;
    width: 100% !important;
  }

  .content {
    padding-top: 24px !important;
  }
}
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="logo">Cyber<span>Escola</span></div>

        <nav class="menu" th:if="${utilizador.tipo == 'aluno'}">
  <a href="/aluno"><i class="fa-solid fa-house"></i> Dashboard</a>
  <a href="/conteudos"><i class="fa-solid fa-book-open"></i> Conteúdos</a>
  <a href="/jogos"><i class="fa-solid fa-gamepad"></i> Jogos</a>
  <a href="/ranking"><i class="fa-solid fa-trophy"></i> Classificação</a>
  <a href="/perfil" class="active"><i class="fa-solid fa-user"></i> Perfil</a>
</nav>
      </div>

      <div class="sidebar-footer">© 2026 CyberEscola</div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="topbar-left" th:text="'Bem-vindo, ' + ${utilizador.nome}">Bem-vindo</div>

        <div class="topbar-right">
          <span class="badge">ALUNO</span>
          <a href="/perfil" class="icon-btn"><i class="fa-solid fa-user"></i></a>
          <a href="/logout" class="icon-btn"><i class="fa-solid fa-right-from-bracket"></i></a>
        </div>
      </div>

      <section class="content">
        <div class="page-header">
          <h1>Jogos</h1>
          <p>Aprende cibersegurança de forma interativa.</p>
        </div>

        <div class="cards-grid">
          <div class="game-card" th:each="jogo : ${jogos}">
            <div class="game-tag" th:text="${jogo.tema}">Tema</div>
            <h3 th:text="${jogo.titulo}">Título</h3>
            <p th:text="${jogo.descricao}">Descrição</p>

            <a th:href="@{'/jogo/' + ${jogo.id}}" class="btn-dark">
              <i class="fa-solid fa-play"></i>
              Jogar agora
            </a>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
