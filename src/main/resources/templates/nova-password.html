<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova palavra-passe | CyberEscola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Manrope', sans-serif;
    }

    body {
      background: #f8f5ef;
      color: #1f1f1f;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      margin: auto;
    }

    header {
      padding: 24px 0;
      border-bottom: 1px solid #ddd4c8;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: #9b6b43;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    nav a {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .btn-nav {
      background: #1f1f1f;
      color: white;
      padding: 10px 18px;
      border-radius: 999px;
      display: inline-block;
      font-weight: 700;
    }

    .login-section {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 0;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #fffdf9;
      border: 1px solid #ddd4c8;
      border-radius: 20px;
      padding: 30px;
    }

    .login-card h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    .login-card p {
      color: #5c5c5c;
      font-size: 0.96rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d7cec2;
      border-radius: 12px;
      background: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: #9b6b43;
    }

    .login-btn {
      width: 100%;
      border: none;
      background: #1f1f1f;
      color: white;
      padding: 13px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .login-btn:hover {
      opacity: 0.92;
    }

    .extra-links {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      font-size: 0.92rem;
      color: #5c5c5c;
    }

    .extra-links a {
      font-weight: 700;
    }

    @media (max-width: 900px) {
      nav a:not(.btn-nav) {
        display: none;
      }

      .login-card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="container navbar">
      <a href="/index.html" class="logo">Cyber<span>Escola</span></a>

      <nav>
        <a href="/index.html">Início</a>
        <a href="/conteudos">Conteúdos</a>
        <a href="/quiz">Quiz</a>
        <a href="/ranking">Ranking</a>
        <a href="/login.html" class="btn-nav">Entrar</a>
      </nav>
    </div>
  </header>

  <section class="login-section">
    <div class="login-card">
      <h1>Nova palavra-passe</h1>
      <p>Define uma nova palavra-passe para a tua conta.</p>

      <form action="/nova-password" method="post">
        <input type="hidden" name="token" th:value="${token}">

        <div class="form-group">
          <label for="password">Nova palavra-passe</label>
          <input type="password" id="password" name="password" placeholder="Introduz a nova palavra-passe" required>
        </div>

        <button type="submit" class="login-btn">Guardar palavra-passe</button>
      </form>

      <div class="extra-links">
        <a href="/login.html">Voltar ao login</a>
        <a href="/index.html">Voltar ao início</a>
      </div>
    </div>
  </section>

</body>
</html>
