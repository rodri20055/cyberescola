<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil | CyberEscola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Manrope', sans-serif;
    }

    body {
      background: #f8f5ef;
      color: #1f1f1f;
      padding: 40px 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: #fffdf9;
      border: 1px solid #ddd4c8;
      border-radius: 22px;
      padding: 28px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    p {
      color: #5c5c5c;
      margin-bottom: 10px;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 16px;
      border-radius: 999px;
      background: #1f1f1f;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Perfil</h1>
      <p>Aqui vais poder ver e editar os teus dados.</p>
      <a href="/aluno" class="back">Voltar ao dashboard</a>
    </div>
  </div>
</body>
</html>
