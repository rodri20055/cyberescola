<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil | CyberEscola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Manrope', sans-serif;
    }

    body {
      background: #f8f5ef;
      color: #1f1f1f;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .dashboard {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
  width: 290px;
  background: #fffdf9;
  border-right: 1px solid #ddd4c8;
  padding: 28px 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  overflow-y: auto;
}

    .sidebar-top {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -1px;
      padding: 0 10px;
    }

    .logo span {
      color: #9b6b43;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 14px;
      border-radius: 14px;
      color: #5c5c5c;
      font-weight: 700;
      transition: 0.2s;
    }

    .menu a:hover {
      background: #efe6da;
      color: #1f1f1f;
    }

    .menu a.active {
      background: #1f1f1f;
      color: white;
    }

    .sidebar-footer {
      padding: 0 10px;
      font-size: 0.86rem;
      color: #7a6b5c;
    }

    .main {
  margin-left: 290px;
  min-height: 100vh;
  width: calc(100% - 290px);
}

    .topbar {
  width: 100%;
  background: #fffdf9;
  border-bottom: 1px solid #ddd4c8;
  padding: 20px 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
    .topbar-left {
      font-weight: 700;
      color: #5c5c5c;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      background: #efe6da;
      color: #6c4b2d;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid #ddd4c8;
      background: #fffdf9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5c5c5c;
    }

    .content {
  width: 100%;
  max-width: 1180px;
  padding: 32px 24px 40px;
  margin: 0 auto;
}

    .page-header {
      margin-bottom: 24px;
    }

    .page-header h1 {
      font-size: 2.3rem;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .page-header p {
      color: #5c5c5c;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }

    .card {
      background: #fffdf9;
      border: 1px solid #ddd4c8;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.03);
    }

    .photo-box {
      text-align: center;
    }

    .photo-preview {
      width: 150px;
      height: 150px;
      margin: 0 auto 16px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #efe6da;
      background: #f3ece3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: #7a6b5c;
    }

    .photo-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-box h2 {
      font-size: 1.3rem;
      margin-bottom: 6px;
    }

    .photo-box p {
      color: #6f6257;
      font-size: 0.95rem;
    }

    .form-title {
      font-size: 1.3rem;
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 0.92rem;
      font-weight: 700;
    }

    .form-group input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d7cec2;
      border-radius: 14px;
      background: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .readonly-box {
      padding: 13px 14px;
      border: 1px solid #e4d9cc;
      border-radius: 14px;
      background: #faf5ee;
      font-size: 0.95rem;
      color: #5c5c5c;
    }

    .section-divider {
      height: 1px;
      background: #ece2d6;
      margin: 28px 0;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .btn {
      padding: 14px 18px;
      border-radius: 999px;
      border: 1px solid #d7cec2;
      background: #fffdf9;
      color: #1f1f1f;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-dark {
      background: #1f1f1f;
      color: white;
      border-color: #1f1f1f;
    }

    .message {
      margin-bottom: 18px;
      padding: 14px 16px;
      border-radius: 14px;
      font-weight: 700;
    }

    .message-success {
      background: #e9f8ee;
      color: #246b3f;
      border: 1px solid #bfe2ca;
    }

    .message-error {
      background: #fdeaea;
      color: #a33a3a;
      border: 1px solid #efc7c7;
    }

    @media (max-width: 950px) {
      .profile-grid {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .dashboard {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #ddd4c8;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="logo">Cyber<span>Escola</span></div>

        <nav class="menu">
          <a href="/aluno"><i class="fa-solid fa-house"></i> Dashboard</a>
          <a href="/conteudos"><i class="fa-solid fa-book-open"></i> Conteúdos</a>
          <a href="/ranking"><i class="fa-solid fa-trophy"></i> Classificação</a>
          <a href="/perfil" class="active"><i class="fa-solid fa-user"></i> Perfil</a>
        </nav>
      </div>

      <div class="sidebar-footer">© 2026 CyberEscola</div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="topbar-left" th:text="'Bem-vindo, ' + ${utilizador.nome}">
          Bem-vindo, Aluno
        </div>

        <div class="topbar-right">
          <span class="badge" th:text="${utilizador.tipo}">ALUNO</span>
          <a href="/logout" class="icon-btn"><i class="fa-solid fa-right-from-bracket"></i></a>
        </div>
      </div>

      <section class="content">
        <div class="page-header">
          <h1>Perfil</h1>
          <p>Consulta e atualiza os teus dados pessoais.</p>
        </div>

        <div th:if="${sucesso}" class="message message-success" th:text="${sucesso}"></div>
        <div th:if="${erro}" class="message message-error" th:text="${erro}"></div>

        <div class="profile-grid">
          <div class="card photo-box">
            <div class="photo-preview">
              <img th:if="${utilizador.fotoPerfil != null and utilizador.fotoPerfil != ''}"
                   th:src="@{${utilizador.fotoPerfil}}"
                   alt="Foto de perfil">
              <i th:if="${utilizador.fotoPerfil == null or utilizador.fotoPerfil == ''}"
                 class="fa-solid fa-user"></i>
            </div>

            <h2 th:text="${utilizador.nome}">Nome</h2>
            <p th:text="${utilizador.email}">email@email.com</p>
          </div>

          <div class="card">
            <h2 class="form-title">Editar dados</h2>

            <form action="/perfil/editar" method="post" enctype="multipart/form-data">
              <div class="form-grid">
                <div class="form-group">
                  <label>Nome</label>
                  <input type="text" name="nome" th:value="${utilizador.nome}" required>
                </div>

                <div class="form-group">
                  <label>Email</label>
                  <input type="email" name="email" th:value="${utilizador.email}" required>
                </div>

                <div class="form-group">
                  <label>Turma</label>
                  <input type="text" name="turma" th:value="${utilizador.turma}">
                </div>

                <div class="form-group">
                  <label>Foto de perfil</label>
                  <input type="file" name="foto">
                </div>

                <div class="form-group">
                  <label>Tipo</label>
                  <div class="readonly-box" th:text="${utilizador.tipo}">aluno</div>
                </div>

                <div class="form-group">
                  <label>Pontos</label>
                  <div class="readonly-box" th:text="${utilizador.pontos}">0</div>
                </div>
              </div>

              <div class="actions">
                <button type="submit" class="btn btn-dark">Guardar alterações</button>
              </div>
            </form>

            <div class="section-divider"></div>

            <h2 class="form-title">Alterar palavra-passe</h2>

            <form action="/perfil/password" method="post">
              <div class="form-grid">
                <div class="form-group full">
                  <label>Palavra-passe atual</label>
                  <input type="password" name="passwordAtual" required>
                </div>

                <div class="form-group">
                  <label>Nova palavra-passe</label>
                  <input type="password" name="novaPassword" required>
                </div>

                <div class="form-group">
                  <label>Confirmar nova palavra-passe</label>
                  <input type="password" name="confirmarPassword" required>
                </div>
              </div>

              <div class="actions">
                <button type="submit" class="btn">Alterar palavra-passe</button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>
  </div>

</body>
</html>
