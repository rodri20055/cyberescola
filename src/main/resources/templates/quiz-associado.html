<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz | CyberEscola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Manrope', sans-serif;
    }

    body {
      background: #f8f5ef;
      color: #1f1f1f;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .dashboard {
      display: flex;
      min-height: 100vh;
    }

   .sidebar {
  width: 290px;
  background: #fffdf9;
  border-right: 1px solid #ddd4c8;
  padding: 28px 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  overflow-y: auto;
}

    .sidebar-top {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -1px;
      padding: 0 10px;
    }

    .logo span {
      color: #9b6b43;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 14px;
      border-radius: 14px;
      color: #5c5c5c;
      font-weight: 700;
      transition: 0.2s;
    }

    .menu a:hover {
      background: #efe6da;
      color: #1f1f1f;
    }

    .menu a.active {
      background: #1f1f1f;
      color: white;
    }

    .sidebar-footer {
      padding: 0 10px;
      font-size: 0.86rem;
      color: #7a6b5c;
    }

    .main {
  margin-left: 290px;
  min-height: 100vh;
  width: calc(100% - 290px);
}

    .topbar {
  width: 100%;
  background: #fffdf9;
  border-bottom: 1px solid #ddd4c8;
  padding: 20px 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

    .topbar-left {
      font-weight: 700;
      color: #5c5c5c;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      background: #efe6da;
      color: #6c4b2d;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid #ddd4c8;
      background: #fffdf9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5c5c5c;
    }

    .content {
  width: 100%;
  max-width: 920px;
  padding: 32px 24px 40px;
  margin: 0 auto;
}

    .quiz-header h1 {
      font-size: 2.25rem;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .quiz-header p {
      color: #6f6257;
      margin-bottom: 20px;
      font-size: 1rem;
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background: #e7ddd1;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 26px;
    }

    .progress-fill {
      width: 100%;
      height: 100%;
      background: #9b6b43;
      border-radius: 999px;
    }

    .quiz-card {
      background: #fffdf9;
      border: 1px solid #ddd4c8;
      border-radius: 24px;
      padding: 26px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.03);
    }

    .quiz-card h2 {
      font-size: 1.2rem;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .answers {
      display: grid;
      gap: 12px;
      margin-bottom: 24px;
    }

    .quiz-actions {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .answer-option {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #ddd4c8;
      background: #fff;
      padding: 16px 18px;
      border-radius: 16px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .answer-option:hover {
      background: #faf5ee;
      border-color: #cdb79d;
    }

    .answer-option input[type="radio"] {
      transform: scale(1.15);
      accent-color: #9b6b43;
    }

    .answer-option span {
      flex: 1;
    }

    .btn-disabled {
      background: #efebe4;
      color: #6f6257;
      border: none;
      padding: 14px 18px;
      border-radius: 14px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-next {
      background: #9b6b43;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="logo">Cyber<span>Escola</span></div>

        <nav class="menu">
          <a href="/aluno"><i class="fa-solid fa-house"></i> Dashboard</a>
          <a href="/conteudos" class="active"><i class="fa-solid fa-book-open"></i> Conteúdos</a>
          <a href="/ranking"><i class="fa-solid fa-trophy"></i> Classificação</a>
          <a href="/perfil"><i class="fa-solid fa-user"></i> Perfil</a>
        </nav>
      </div>

      <div class="sidebar-footer">© 2026 CyberEscola</div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="topbar-left" th:text="'Bem-vindo, ' + ${utilizadorLogado.nome}">
          Bem-vindo, Aluno
        </div>

        <div class="topbar-right">
          <span class="badge" th:text="${utilizadorLogado.tipo}">ALUNO</span>
          <a href="/perfil" class="icon-btn"><i class="fa-solid fa-user"></i></a>
          <a href="/logout" class="icon-btn"><i class="fa-solid fa-right-from-bracket"></i></a>
        </div>
      </div>

      <section class="content">
        <div class="quiz-header">
          <h1 th:text="${quiz.titulo}">Quiz</h1>
          <p>Responde às 5 perguntas</p>
        </div>

        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>

        <div class="quiz-card">
          <form th:action="@{'/quiz-associado/' + ${quiz.idConteudo}}" method="post">

            <div th:each="p, iter : ${perguntas}" style="margin-bottom: 28px;">
              <h2 th:text="${iter.index + 1} + '. ' + ${p.enunciado}">
                Pergunta
              </h2>

              <div class="answers">
                <label class="answer-option">
                  <input type="radio"
                         th:name="'resposta' + ${iter.index + 1}"
                         th:value="${p.opcao1}"
                         required>
                  <span th:text="${p.opcao1}">Opção 1</span>
                </label>

                <label class="answer-option">
                  <input type="radio"
                         th:name="'resposta' + ${iter.index + 1}"
                         th:value="${p.opcao2}"
                         required>
                  <span th:text="${p.opcao2}">Opção 2</span>
                </label>

                <label class="answer-option">
                  <input type="radio"
                         th:name="'resposta' + ${iter.index + 1}"
                         th:value="${p.opcao3}"
                         required>
                  <span th:text="${p.opcao3}">Opção 3</span>
                </label>

                <label class="answer-option">
                  <input type="radio"
                         th:name="'resposta' + ${iter.index + 1}"
                         th:value="${p.opcao4}"
                         required>
                  <span th:text="${p.opcao4}">Opção 4</span>
                </label>
              </div>
            </div>

            <div class="quiz-actions">
              <a href="/conteudos" class="btn-disabled" style="text-decoration:none;">Sair</a>
              <button type="submit" class="btn-next">Submeter quiz</button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>

</body>
</html>
