<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking | CyberEscola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Manrope', sans-serif;
    }

    body {
      background: #f8f5ef;
      color: #1f1f1f;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .dashboard {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 290px;
      background: #fffdf9;
      border-right: 1px solid #ddd4c8;
      padding: 28px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

.position-badge {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  background: #efe6da;
  color: #6c4b2d;
}

.position-gold {
  background: #f3e3b2 !important;
  color: #7a5a00 !important;
}

.position-silver {
  background: #e4e4e4 !important;
  color: #5f5f5f !important;
}

.position-bronze {
  background: #e6c7ad !important;
  color: #7a4a22 !important;
}

    .sidebar-top {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -1px;
      padding: 0 10px;
    }

    .logo span {
      color: #9b6b43;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 14px;
      border-radius: 14px;
      color: #5c5c5c;
      font-weight: 700;
      transition: 0.2s;
    }

    .menu a i {
      width: 18px;
      text-align: center;
    }

    .menu a:hover {
      background: #efe6da;
      color: #1f1f1f;
    }

    .menu a.active {
      background: #1f1f1f;
      color: white;
    }

    .sidebar-footer {
      padding: 0 10px;
      font-size: 0.86rem;
      color: #7a6b5c;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .topbar {
      width: 100%;
      background: #fffdf9;
      border-bottom: 1px solid #ddd4c8;
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .topbar-left {
      font-weight: 700;
      color: #5c5c5c;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      background: #efe6da;
      color: #6c4b2d;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid #ddd4c8;
      background: #fffdf9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5c5c5c;
      transition: 0.2s;
    }

    .icon-btn:hover {
      background: #1f1f1f;
      color: white;
      border-color: #1f1f1f;
    }

    .content {
      width: 100%;
      max-width: 1400px;
      padding: 30px 24px 34px;
    }

    .page-header {
      margin-bottom: 24px;
    }

    .page-header h1 {
      font-size: 2.3rem;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .page-header p {
      color: #5c5c5c;
      font-size: 1rem;
    }

    .ranking-card {
      background: #fffdf9;
      border: 1px solid #ddd4c8;
      border-radius: 24px;
      padding: 24px;
    }

    .ranking-table {
      width: 100%;
      border-collapse: collapse;
    }

    .ranking-table thead th {
      text-align: left;
      font-size: 0.9rem;
      color: #74685d;
      padding-bottom: 14px;
      border-bottom: 1px solid #eadfd2;
    }

    .ranking-table tbody td {
      padding: 18px 8px 18px 0;
      border-bottom: 1px solid #f0e7dc;
      vertical-align: middle;
    }

    .ranking-table tbody tr:last-child td {
      border-bottom: none;
    }

    .user-row {
      background: #faf5ee;
    }

    .position-badge {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      background: #efe6da;
      color: #6c4b2d;
    }

    .name-cell {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: #1f1f1f;
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .tag-you {
      display: inline-block;
      margin-left: 8px;
      padding: 4px 8px;
      font-size: 0.74rem;
      font-weight: 800;
      border-radius: 999px;
      background: #1f1f1f;
      color: white;
    }

    .turma-cell {
      color: #6f6257;
      font-weight: 600;
    }

    .tipo {
      color: #6f6257;
      font-size: 0.92rem;
      text-transform: capitalize;
    }

    .score {
      font-weight: 800;
      font-size: 1rem;
    }

    @media (max-width: 900px) {
      .dashboard {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #ddd4c8;
      }

      .menu {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 700px) {
      .ranking-table,
      .ranking-table thead,
      .ranking-table tbody,
      .ranking-table th,
      .ranking-table td,
      .ranking-table tr {
        display: block;
      }

      .ranking-table thead {
        display: none;
      }

      .ranking-table tbody tr {
        padding: 14px 0;
        border-bottom: 1px solid #eadfd2;
      }

      .ranking-table tbody td {
        border: none;
        padding: 6px 0;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard">

    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="logo">Cyber<span>Escola</span></div>

        <nav class="menu">
          <a href="/aluno"><i class="fa-solid fa-house"></i> Dashboard</a>
          <a href="/conteudos"><i class="fa-solid fa-book-open"></i> Conteúdos</a>
          <a href="/ranking" class="active"><i class="fa-solid fa-trophy"></i> Classificação</a>
          <a href="/perfil"><i class="fa-solid fa-user"></i> Perfil</a>
        </nav>
      </div>

      <div class="sidebar-footer">
        © 2026 CyberEscola
      </div>
    </aside>

    <main class="main">

      <div class="topbar">
        <div class="topbar-left" th:text="'Bem-vindo, ' + ${utilizadorLogado.nome}">
          Bem-vindo, Aluno
        </div>

        <div class="topbar-right">
          <span class="badge" th:text="${utilizadorLogado.tipo}">ALUNO</span>

          <a href="/perfil" class="icon-btn" title="Perfil">
            <i class="fa-solid fa-user"></i>
          </a>

          <a href="/logout" class="icon-btn" title="Sair">
            <i class="fa-solid fa-right-from-bracket"></i>
          </a>
        </div>
      </div>

      <section class="content">
        <div class="page-header">
          <h1>Ranking da plataforma</h1>
          <p>Consulta a classificação geral dos utilizadores da CyberEscola.</p>
        </div>

        <div class="ranking-card">
          <table class="ranking-table">
            <thead>
              <tr>
                <th>Posição</th>
                <th>Utilizador</th>
                <th>Turma</th>
                <th>Tipo</th>
                <th>Pontos</th>
              </tr>
            </thead>

            <tbody>
              <tr th:each="u, iter : ${ranking}"
                  th:classappend="${u.idUtilizador == utilizadorLogado.idUtilizador} ? 'user-row' : ''">

                <td>
                  <span class="position-badge"
      th:classappend="${iter.index == 0} ? ' position-gold' :
                      (${iter.index == 1} ? ' position-silver' :
                      (${iter.index == 2} ? ' position-bronze' : ''))"
      th:text="${iter.index + 1}">
  1
</span>
                </td>

                <td>
                  <div class="name-cell">
                    <div class="avatar" th:text="${#strings.substring(u.nome,0,1)}">A</div>

                    <div>
                      <span th:text="${u.nome}">Nome</span>
                      <span th:if="${u.idUtilizador == utilizadorLogado.idUtilizador}" class="tag-you">Tu</span>
                    </div>
                  </div>
                </td>

                <td class="turma-cell" th:text="${u.turma}">Turma</td>

                <td class="tipo" th:text="${u.tipo}">aluno</td>

                <td class="score" th:text="${u.pontos}">0</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

</body>
</html>
